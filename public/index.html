<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Entry</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Employee Entry</h1>
  </header>

  <main>
    <section class="card">
      <h2>Add an employee</h2>
      <form id="employee-form" novalidate>
        <div class="grid">
          <label>First name *
            <input name="first_name" maxlength="80" required />
          </label>
          <label>Last name *
            <input name="last_name" maxlength="80" required />
          </label>
          <label>Email *
            <input name="email" type="email" maxlength="190" required />
          </label>
          <label>Phone
            <input name="phone" type="tel" maxlength="20" placeholder="+91 98765 43210" />
          </label>
          <label>Department *
            <select name="department" required>
              <option value="">Select...</option>
            </select>
          </label>
          <label>Designation *
            <input name="designation" maxlength="120" required />
          </label>
          <label>Date of joining *
            <input name="date_of_joining" type="date" required />
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="submit-btn">Save employee</button>
          <button type="reset" class="secondary">Clear</button>
        </div>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Employees <span id="count"></span></h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Phone</th><th>Department</th>
              <th>Designation</th><th>Joined</th><th></th>
            </tr>
          </thead>
          <tbody id="employee-rows">
            <tr><td colspan="7" class="muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
