# Local development: runs MySQL and the app together, mirroring the Kubernetes setup.
# Usage:  docker compose up --build      then open http://localhost:3000
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass-local
      MYSQL_DATABASE: employees
      MYSQL_USER: empapp
      MYSQL_PASSWORD: apppass-local
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpass-local"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: empapp
      DB_PASSWORD: apppass-local
      DB_NAME: employees
    ports:
      - "3000:3000"

volumes:
  mysql-data:
